name: Feature request
description: Suggest an idea or improvement for zettle_sdk
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search existing issues (open and closed) before filing a new one.
      options:
        - label: I have searched the existing issues
          required: true

  - type: dropdown
    attributes:
      label: Platform
      description: Which platforms would this affect?
      multiple: true
      options:
        - Android
        - iOS
        - Dart API only
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem
      description: What problem are you trying to solve? Is your feature request related to a problem?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: |
        What would you like to happen? If this exposes an option that PayPal/Zettle's own Android or iOS SDK already supports, a link to their documentation helps a lot.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've considered.
