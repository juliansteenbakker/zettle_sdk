name: zettle_sdk
description: "A flutter plugin for the PayPal Point of Sale (formerly Zettle by Paypal & iZettle) Android and iOS SDK."
version: 1.0.0
homepage: https://github.com/juliansteenbakker/zettle_sdk

environment:
  sdk: ^3.3.0
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.steenbakker.zettle_sdk
        pluginClass: ZettleSdkPlugin
      ios:
        pluginClass: ZettleSdkPlugin
